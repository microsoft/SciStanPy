  workspace_name: bjwamltws
  name: msrresrchvc

environment:
  image: scistanpy:0.0.32
  registry: bjwamltcr.azurecr.io

data:
  remote_dir: data/dms_stan/flip3_data/

code:
  local_dir: $CONFIG_DIR

search:
