  max_trials: 750
  parallel_trials: 100
  job_template:
    name: "{experiment_name:s}_{dset_ind:s}"
    sku: 8C15
    sla_tier: premium
    command:
      - bash run_hmc_job-specific.sh {dset_ind}
      - touch $$AMLT_DIRSYNC_DIR/.amlt_flush_upload
      - while [ ! -f "$$AMLT_DIRSYNC_DIR/.amlt_flush_upload" ]; do sleep 1; echo "waiting"; done
    submit_args:
      max_run_duration_seconds: 1209600
      env:
        _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/84a94086-6c26-4611-8249-b3549944c86c/resourcegroups/bjwamlt/providers/Microsoft.ManagedIdentity/userAssignedIdentities/bjwamltuami
        AMLT_DIRSYNC_FREQ: 600
    identity: managed
  type: hyperdrive
  sampling: grid
  params:
    - name: dset_ind
      values: choice("1", "3", "4", "6", "19", "20", "22", "23", "25", "26", "28", "29", "31", "32", "34", "35", "37", "38", "40", "41", "43", "44", "46", "47", "49", "50", "52", "53", "55", "56", "57", "58", "59", "60", "61", "62")
